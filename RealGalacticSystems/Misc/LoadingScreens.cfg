Sigma88LoadingScreens
{
	removeStockScreens = False
	removeStockTips = False
}
@Sigma88LoadingScreens:HAS[@RGSSettings[#LoadingScreens[?rue]]]
{
	folder = RealGalacticSystems/Misc/LoadingScreens
	logoScreen = RealGalacticSystems/Misc/logo.png
}
@Sigma88LoadingScreens:HAS[@RGSSettings[#LoadingTips[?rue]]]
{
	tipsFile = RealGalacticSystems/Misc/Tips.txt
}
@Sigma88LoadingScreens:HAS[@RGSSettings[#ReplaceStockLoadingScreens[?rue]]]
{
	removeStockScreens = True
}
@Sigma88LoadingScreens:HAS[@RGSSettings[#ReplaceStockTips[?rue]]]
{
	removeStockTips = True
}