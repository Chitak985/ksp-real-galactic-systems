// Galaxy groups
@Kopernicus:BEFORE[RealGalacticSystems]
{
	@Body,*
	{
		#@RGSSettings {}
	}
}
@Kopernicus:FOR[RealGalacticSystems]
{
	!Body,*:HAS[@RGSSettings[#FarGalaxies1[?rue]],#RGSType[Far1]]
	!Body,*:HAS[@RGSSettings[#FarGalaxies2[?rue]],#RGSType[Far2]]
	!Body,*:HAS[@RGSSettings[#FarGalaxies3[?rue]],#RGSType[Far3]]
	!Body,*:HAS[@RGSSettings[#FarGalaxies4[?rue]],#RGSType[Far4]]
	!Body,*:HAS[@RGSSettings[#FarGalaxies5[?rue]],#RGSType[Far5]]
}
@Kopernicus:AFTER[RealGalacticSystems]
{
	@Body,*
	{
		!RGSSettings {}
	}
}

// Loading screens
@Sigma88LoadingScreens:BEFORE[RealGalacticSystems]
{
  #@RGSSettings {}
}
@Sigma88LoadingScreens:AFTER[RealGalacticSystems]
{
  !RGSSettings {}
}