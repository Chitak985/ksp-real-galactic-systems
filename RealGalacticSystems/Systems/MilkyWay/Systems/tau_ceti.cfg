// Config name is the name parameter but all lowercase
@Kopernicus:FOR[RealGalacticSystems]
{
  Body
  {
	  RGS = True
    name = NAME_UNDERSCORES  // Most common name with every special character replaced with an underscore
    barycenter = False
    finalizeOrbit = False
    randomMainMenuBody = False
    contractWeight = 5
    cacheFile = RealGalacticSystems/Cache/NAME_UNDERSCORES.bin  // Replace NAME_UNDERSCORES with most common name with every special character replaced with an underscore

    Template
    {
      name = Sun
    }
    Properties
    {
      displayName = NAME  // Most common name
      description = DESC  // Make a simple description less than 100 symbols (do not cut off at 100 symbols, make it shorter by removing some facts)
      radius = 549603000  // Radius in meters
      mass = 1.38e+30  // Mass in kg
      rotates = true
      rotationPeriod = 1022885.3807706027  // Seconds for one full rotation
      tidallyLocked = False
      useTheInName = False
      selectable = True
			ScienceValues
			{
				landedDataValue = 100
				splashedDataValue = 100
				flyingLowDataValue = 100
				flyingHighDataValue = 100
				inSpaceLowDataValue = 20
				inSpaceHighDataValue = 15
				recoveryValue = 50  // Add 1 to 50 for each light year (the value set is wrong)
				flyingAltitudeThreshold = 54960.3  // Radius/10000
				spaceAltitudeThreshold = 1648809000  // Radius*3
			}
    }
    Orbit  // Replace this whole thing with an orbit
    {
      referenceBody = SagittariusA
      semiMajorAxis = 3.704737992061969e+20
      eccentricity = 0.3409112368623777
      inclination = 4.292540691598339
      longitudeOfAscendingNode = 1.6252430089895653
      argumentOfPeriapsis = 207.6843264726601
      meanAnomalyAtEpoch = 0.0
      epoch = 0
    }
    ScaledVersion
    {
      Light
      {
        luminosity = 612  // Sun luminosity is 1360, may need recalculation
				sunlightShadowStrength = 0.7523364  // Reduces with star size
				IVASunColor = 1,0.976999998,0.896000028,1  // Main color
        sunlightColor = 1,0.976999998,0.896000028,1  // Main color
				scaledSunlightColor = 1,0.976999998,0.896000028,1  // Main color
				sunLensFlareColor = 1,0.976999998,0.896000028,1  // Main color
				ambientLightColor = 0.1,0.097699998,0.089600003,1  // Main color / 10
        brightnessCurve
        {
          key = -0.01573471 0.2 0 0
          key = 0.005 0.2 0 0
          key = 0.01 0 0 0
        }
        IntensityCurve
        {
          key =	55534 	1.3	0	-5.714E-11
          key =	7168000000000 	0	0	0
        }
        IVAIntensityCurve
        {
          key =	0 	1.17	0 -5.143E-11
          key = 7168000000000 	0	0	0
        }
        ScaledIntensityCurve
        {
          key =	0 	1.3	0	-3.429E-07
          key =	1194666667 	0	0	0
        }
      }
    }
    HazardousBody
    {
      Item
      {
        ambientTemp = 5320.0  // Temp in K
        AltitudeCurve
        {
            key = 1.00E+08 1.00
            key = 1.00E+10 0.00
        }
      }
    }
  }
}
